[package]
name = "moroccan_docs"
version = "0.2.0"
edition = "2021"
description = "Municipal Administrative Police Document Management System"
authors = ["Moroccan Docs Team"]

[dependencies]
# Document generation
docx-rs = "0.4"

# Excel database
calamine = "0.25"
rust_xlsxwriter = "0.76"

# Core utilities
uuid = { version = "1.10", features = ["v4"] }
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# GUI
eframe = "0.29"
egui = "0.29"
egui_extras = { version = "0.29", features = ["all_loaders"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
arabic_reshaper = "0.4.2"
unicode-bidi = "0.3.18"
open = "5.3.3"
image = "0.25.9"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Windows-specific optimizations
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser"] }
